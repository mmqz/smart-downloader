# CI（D35 扩展）：
#  - rust: 纯 Rust crates 的 fmt/clippy/test，windows + ubuntu 双平台；
#    daemon 增补 feature 矩阵（ftp / nas / ftp,nas；nas 语义属 Linux，测试仅在 ubuntu 跑）。
#  - bt-integration: 依赖 libtorrent native 链接环境（本地配方见 scripts/bt_env.sh 与
#    docs/nas/WORKSPACE.md；系统包为 2.0.x，ffi 内核按 2.1 API 编写需 shim）。
#    待配方在 Linux CI 实测一轮后启用（避免盲跑碎 CI）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny warnings, excludes btcore)
        run: >
          cargo clippy --workspace --exclude smart-dl-btcore
          --features smart-dl-httpdl/ftp -- -D warnings

      # daemon feature 矩阵：ftp 全平台编译检查；nas 仅 ubuntu（tar/kill 语义属 Linux）。
      - name: clippy daemon features (ftp)
        run: cargo clippy -p smart-dl-daemon --features ftp -- -D warnings

      - name: clippy daemon features (nas + ftp,nas)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p smart-dl-daemon --features nas -- -D warnings
          cargo clippy -p smart-dl-daemon --features "ftp,nas" -- -D warnings

      - name: test core
        run: cargo test -p smart-dl-core

      - name: test httpdl (with ftp feature)
        run: cargo test -p smart-dl-httpdl --features ftp

      - name: test provider
        run: cargo test -p smart-dl-provider

      - name: test daemon
        run: cargo test -p smart-dl-daemon

      - name: test daemon (ftp + nas)
        if: runner.os == 'Linux'
        run: cargo test -p smart-dl-daemon --features "ftp,nas"

  bt-integration:
    # 后置独立：需 libtorrent native。本地配方：scripts/bt_env.sh（LT_KERNEL_LIB_DIR +
    # LT_VCPKG_LIB_DIR + SEED_MAIN 三变量，no-root apt download + dpkg -x + fakevcpkg）。
    # ffi 内核按 libtorrent 2.1 API 编写，系统包 2.0.x 需 4 处 shim（from_info_section /
    # files_impl / remote_endpoint / set_sequential_range），待脚本化实测后启用。
    name: bt integration (ubuntu, libtorrent)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: placeholder (enable after scripts/ci/bt-linux-setup.sh is validated)
        run: echo "BT integration tests run locally — see scripts/bt_env.sh"
