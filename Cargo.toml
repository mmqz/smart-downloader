[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/btcore",
    "crates/httpdl",
    "crates/provider",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
