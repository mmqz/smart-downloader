[package]
name = "multi_downloader"
version = "0.1.0"
edition = "2021"
authors = ["multi-downloader prototype (Task 6-B)"]
description = "Rust multi-protocol downloader prototype. Borrows ideas from qBittorrent, FileCentipede, FlashGet, Tixati and Quark Cloud Drive."
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "multi_downloader"
path = "src/lib.rs"

[[bin]]
name = "mdc"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client (rustls backend, no native-tls / openssl)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
bytes = "1"

# TLS (rustls replaces OpenSSL used by Quark)
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

# Hashing
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"

# AEAD ciphers (replace Tixati's RC4 in MSE/PE)
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Persistence (SQLite WAL — replaces FlashGet's .jc! header-embedded metadata)
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI + errors + logging
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
url = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
crc32fast = "1"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
debug = true
