[package]
name = "smart-dl-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# magnet/.torrent → libtorrent 薄核（smart-dl-btcore）。默认关：CI 基线不链接
# libtorrent；本机有 LT 链接环境时启用（cargo build -p smart-dl-daemon --features bt）。
bt = ["dep:smart-dl-btcore"]
# 迅雷 SDK BT 引擎（Windows-only，免登录匿名模式）。
xunlei = ["smart-dl-btcore/xunlei"]
# 迅雷 BT 任务导入（xlbt.cfg + .bt.xltd + .torrent → fastresume）。
xunlei-import = ["dep:xunlei-convert", "bt"]
# F5 P2SP：云盘直链 web seed 注入（POST /tasks/:id/webseeds）。e2e 测试门控，
# 隐含 bt（验收命令 `--features bt webseed` 对空格分隔/测试名过滤两种解析均兼容）。
webseed = ["bt"]
# NAS 版迅雷引擎托管（xllite/pan-cli，Linux-only；附录 E-2026-08-30）。
# 审计修复（batch10-G，架构审查问题 2③）：转发 btcore 校准版 nas_remote
#（A2-A5 已校准的 551 行实现）——原 `nas = []` 空转发令 daemon 只编译自身
# 的骨架版 nas_remote（端点全假设区），校准版永远不可达。
nas = ["smart-dl-btcore/nas"]
# FTP 引擎（D12：并入 httpdl，feature-gated）。
ftp = ["smart-dl-httpdl/ftp"]
# SFTP 引擎（C-S1：russh + russh-sftp，纯 Rust 栈；与 ftp 平行门控）。
sftp = ["smart-dl-httpdl/sftp"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
percent-encoding = { workspace = true }
url = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true } # SSE 事件流（unfold stream，E12）
toml = "0.8"
reqwest = { workspace = true }
quick-xml = { workspace = true }
smart-dl-core = { path = "../core" }
smart-dl-rss = { path = "../rss" }
smart-dl-httpdl = { path = "../httpdl" }
smart-dl-provider = { path = "../provider" }
smart-dl-btcore = { path = "../btcore", optional = true }
xunlei-convert = { path = "../xunlei-convert", optional = true }
anyhow = "1"
parking_lot = { workspace = true }
uuid = { workspace = true }
qrcode = "0.14" # 终端二维码（xunlei-login --qr）
regex = "1" # RSS 规则 use_regex（batch5；已在依赖树）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] } # S1 备用限速本地时段
tower-http = { version = "0.6", features = ["fs"] } # S2 内嵌 UI 静态服务（--ui-dir）
tower = { version = "0.5", features = ["limit"] } # batch8：全局并发请求上限

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.20"
base64 = "0.22"
sha1 = { workspace = true }
sha2 = "0.10"
md-5 = "0.10"

# 进程生命周期实机测试（lifecycle_process.rs，unix-only：SIGTERM）
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["signal"] }