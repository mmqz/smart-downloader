[package]
name = "smart-dl-daemon"
version.workspace = true
edition.workspace = true

[features]
# magnet/.torrent → libtorrent 薄核（smart-dl-btcore）。默认关：CI 基线不链接
# libtorrent；本机有 LT 链接环境时启用（cargo build -p smart-dl-daemon --features bt）。
bt = ["dep:smart-dl-btcore"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
url = { workspace = true }
smart-dl-core = { path = "../core" }
smart-dl-httpdl = { path = "../httpdl" }
smart-dl-provider = { path = "../provider" }
smart-dl-btcore = { path = "../btcore", optional = true }

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.20"
base64 = "0.22"